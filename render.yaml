# Blueprint de Render (opcional): New + > Blueprint > seleccionar este repositorio
services:
  - type: web
    name: finanzapro-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # pegar la cadena de MongoDB Atlas en el Dashboard
      - key: CORS_ORIGIN
        sync: false # p. ej. http://localhost:5173,https://finanzapro.vercel.app
